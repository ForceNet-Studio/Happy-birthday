<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteName</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="map">
    <img src="assets/b1.png" alt="Network error">
  </div>
  <div class="map2">
    <img src="assets/b2.png" alt="Network error">
  </div>
  <button class="gifs" id="openVideo" type="button" aria-label="Открыть видео">
    <span class="gif-grid" aria-hidden="true">
      <img src="assets/bg3.gif" alt="">
      <img src="assets/bg7.gif" alt="">
      <img src="assets/bg9.gif" alt="">
      <img src="assets/bg19.gif" alt="">
      <img src="assets/bg20.gif" alt="">
      <img src="assets/bg2.gif" alt="">
    </span>
  </button>
  <div class="spacer"></div>
  <div class="content">
    <h1>С днём рождения!</h1>
    <p style="height: 570px;">Поздравляю тебя с днём рождения! Желаю тебе крепкого здоровья, вечного счатся и что бы все твои мечты сбывались!</p>
  </div>

  <div class="video-modal" id="videoModal" aria-hidden="true">
    <div class="video-dialog" role="dialog" aria-modal="true" aria-label="Видео">
      <button class="close-video" id="closeVideo" type="button" aria-label="Закрыть">×</button>
      <video id="birthdayVideo" controls playsinline preload="metadata">
        <source src="assets/video.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
      </video>
    </div>
  </div>

  <script src="Logic/script.js"></script>
</body>
</html>
